{% extends "home.html" %}

{% block content %}

<div style="width: 50%; height: 500px; margin: auto" class="pt-5">
   <h3>Movie Rating Form</h3>
        {% comment %} <form method="get" action="/first_app/about/"> {% endcomment %}
        <form method="post" action="/first_app/about/">
            {% csrf_token %}
            <div class="mb-3">
                    <label for="exampleInput Name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="exampleInput Name" aria-describedby="nameHelp" name='username'>
            </div>
            <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name='email'>
            </div>
            <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1">
            </div>
            <div class="form-field">
                <label for="fieldSelect" class="form-label">Country From You're Rating</label>
                <select class="form-control" id="fieldSelect" name='select'>
                <option selected>Choose one…</option>
                <option value="United States">United States</option>
                <option value="Canada">Canada</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Bangladesh">Bangladesh</option>
                </select>
            </div>
            <button type="submit" class="btn-solid theme-primary">Submit</button>
        </form>
        
        <h4>Name {{name}}</h4>
        <h4>Email {{email}}</h4>
</div>
{% endblock  %}
