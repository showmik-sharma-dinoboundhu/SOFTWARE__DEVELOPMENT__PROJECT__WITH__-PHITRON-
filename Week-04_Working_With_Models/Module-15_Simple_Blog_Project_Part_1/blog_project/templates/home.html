{% extends "base.html" %}

{% block content %}
    <div class="d-flex flex-wrap justify-content-center px-5 pt-5">
        {% for post in data %}
            <div class="col-sm-3 mb-4">
            <div class="card mx-2 h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{post.title}}</h5>
                    <p class="card-text description">{{post.content}}</p>

                    <p>Author : {{post.author.name}}</p>

                   <p>
                        Categories:

                        {% for cat in post.catagories.all %}
                            <button class="btn btn-primary btn-sm m-2" disabled>
                                {{ cat.name }}
                            </button>
                        {% empty %}
                        <button class="btn btn-primary btn-sm m-2" disabled>
                                No categories found!
                        </button>
                        {% endfor %}
                    </p>
                    <a href="{% url "edit_posts" post.id %}" class="btn btn-warning mt-auto w-100">Edit</a>
                    <a href="#" class="btn btn-danger">Delete</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
{% endblock %}
