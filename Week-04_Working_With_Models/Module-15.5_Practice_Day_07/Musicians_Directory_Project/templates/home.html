{% extends "base.html" %}
{% block content %}

<div class="d-flex flex-wrap justify-content-center px-5 pt-5">

  {% for i in data %}
  <div class="col-sm-3 mb-3 mb-sm-0">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">{{i.album_name}}</h5>
        <p class="card-text">{{i.musician}}</p>
        <a href="#" class="btn btn-primary">Go somewhere</a>
      </div>
    </div>
  </div>
  {% endfor %}

</div>

{% endblock  %}
