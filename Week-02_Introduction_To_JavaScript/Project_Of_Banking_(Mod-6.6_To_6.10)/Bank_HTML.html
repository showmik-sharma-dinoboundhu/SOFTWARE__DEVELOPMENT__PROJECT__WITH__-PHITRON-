<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    
    <!-- Link up with CSS -->
    <link rel="stylesheet" href="Bank_CSS.css">

</head>
<body>
    <div class="amount-container">
        <div class="diposit amount-box">
            <div>
                <h1 id="deposit-amount-output" class="amount">00</h1>
                <p>Diposit Amount:</p>
            </div>
        </div>
        <div class="withdraw amount-box">
            <div>
                <h1 id="withdraw-amount-output" class="amount">00</h1>
                <p>Withdraw Amount:</p>
            </div>
        </div>
        <div class="total amount-box">
            <div>
                <h1 id="total-amount-output" class="amount">00</h1>
                <p>Total Amount:</p>
            </div>
        </div>
    </div>


    <div class="diposit-withdraw-container">
        <div class="diposit-box input-box">
            <input type="number" id="deposit-amount-input"> <br>
            <button onclick="handleDiposit()" class="btn deposit-btn">Deposit</button>
        </div>
        
        <div class="withdraw-box"></div>
        <div class="diposit-box input-box">
            <input type="number" id="withdraw-input"> <br>
            <button onclick="handleWithdraw()" class="btn withdrew-btn">Withdraw</button>
        </div>
    </div>














    <!-- LInk Up wiht JS -->
    <script src="Bank_JS.js"></script>
    
</body>

<!-- Script CND -->
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</html>
